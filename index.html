<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitraje PRO - ByMO Technology</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --container-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --result-bg: #e9ecef;
            --menu-bg: #e0e0e0;
            --green-text: #28a745;
            --red-text: #dc3545;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --container-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --input-bg: #2c2c2c;
                --input-border: #444444;
                --result-bg: #2a2a2a;
                --menu-bg: #333333;
                --green-text: #4caf50;
                --red-text: #ff5252;
            }
        }

        body { font-family: Arial, sans-serif; padding: 20px; background-color: var(--bg-color); color: var(--text-color); transition: background 0.3s; }
        .container { max-width: 400px; margin: 0 auto; background: var(--container-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); position: relative; }
        
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-svg { width: 60px; height: 60px; fill: #ffcc00; filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.5)); }

        h2 { text-align: center; color: var(--text-color); font-size: 20px; margin-bottom: 15px; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 12px; font-size: 14px;}
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--input-border); border-radius: 5px; box-sizing: border-box; font-size: 16px; background-color: var(--input-bg); color: var(--text-color); }
        
        .btn-principal { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; margin-top: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-whatsapp { width: 100%; padding: 10px; background-color: #25d366; color: white; border: none; border-radius: 5px; margin-top: 10px; font-size: 14px; font-weight: bold; cursor: pointer; }
        
        .result { margin-top: 20px; padding: 15px; background: var(--result-bg); border-radius: 5px; text-align: center; font-size: 18px; }
        .seccion { display: none; margin-top: 15px; }
        .activa { display: block; }
        .menu-principal { background-color: var(--menu-bg); font-weight: bold; margin-bottom: 10px; }
        
        .footer-tech { text-align: center; font-size: 10px; color: var(--text-color); opacity: 0.5; margin-top: 25px; font-style: italic; }
        .texto-verde { color: var(--green-text); font-weight: bold; }
        .texto-rojo { color: var(--red-text); font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="42" y="20" width="6" height="60" rx="3" />
                <rect x="25" y="35" width="6" height="30" rx="3" />
                <rect x="59" y="35" width="6" height="30" rx="3" />
                <rect x="76" y="45" width="6" height="10" rx="3" />
                <rect x="9" y="45" width="6" height="10" rx="3" />
                <circle cx="50" cy="40" r="5" />
                <circle cx="50" cy="60" r="5" />
                <path d="M50 40 L65 40 L65 55 L50 55" fill="none" stroke="#ffcc00" stroke-width="5" stroke-linecap="round"/>
            </svg>
        </div>

        <h2>Calculadora de Arbitraje</h2>
        
        <select id="menuTipo" class="menu-principal" onchange="cambiarMenu()">
            <option value="producto">1. Precio Producto en USDT</option>
            <option value="banco">2. Arbitraje: Banco vs USDT</option>
            <option value="efectivo">3. Arbitraje: USDT vs Efectivo</option>
            <option value="zelle_cop">4. Arbitraje: Zelle -> COP -> USDT</option>
        </select>

        <div id="sec-producto" class="seccion activa">
            <label>Moneda de Referencia (BCV):</label>
            <select id="monedaRef" onchange="actualizarLabelMoneda()">
                <option value="USD">Dólar ($)</option>
                <option value="EUR">Euro (€)</option>
            </select>
            <label>Precio Producto (<span id="labelPrecioRef">$</span>):</label>
            <input type="number" id="prodUsd" value="0.00" step="0.01" inputmode="decimal">
            <label>Tasa BCV (<span id="labelTasaRef">Bs/$</span>):</label>
            <input type="number" id="tasaBcv" value="0.00" step="0.01" inputmode="decimal">
            <label>Tasa Binance (Bs/USDT):</label>
            <input type="number" id="tasaBin" value="0.00" step="0.01" inputmode="decimal">
            <button class="btn-principal" onclick="calcularProducto()">Calcular</button>
            <div class="result" id="resProd">Resultado: 0 USDT</div>
            <button class="btn-whatsapp" onclick="compartirWp('producto')">Copiar para WhatsApp</button>
        </div>

        <div id="sec-banco" class="seccion">
            <label>Precio Venta USDT (Bs):</label>
            <input type="number" id="precioUsdt1" value="0.00" step="0.01" inputmode="decimal">
            <label>Precio Compra Banco (Bs):</label>
            <input type="number" id="precioBcv1" value="0.00" step="0.01" inputmode="decimal">
            <label>Comisión Banco (%):</label>
            <input type="number" id="comBanco" value="0.0" step="0.1" inputmode="decimal">
            <label>Comisión Binance (%):</label>
            <input type="number" id="comBinance" value="0.0" step="0.1" inputmode="decimal">
            <button class="btn-principal" onclick="calcularBanco()">Calcular</button>
            <div class="result" id="resBanco">Resultado: 0%</div>
            <button class="btn-whatsapp" onclick="compartirWp('banco')">Copiar para WhatsApp</button>
        </div>

        <div id="sec-efectivo" class="seccion">
            <label>Operación:</label>
            <select id="tipoCambioEf">
                <option value="usdt_a_efectivo">USDT -> Efectivo</option>
                <option value="efectivo_a_usdt">Efectivo -> USDT</option>
            </select>
            <label>Precio USDT (Bs):</label>
            <input type="number" id="precioUsdt2" value="0.00" step="0.01" inputmode="decimal">
            <label>Precio Efectivo (Bs):</label>
            <input type="number" id="precioEf" value="0.00" step="0.01" inputmode="decimal">
            <label>Comisión Cambio (%):</label>
            <input type="number" id="comCambio" value="0.0" step="0.1" inputmode="decimal">
            <button class="btn-principal" onclick="calcularEfectivo()">Calcular</button>
            <div class="result" id="resEfectivo">Resultado: 0%</div>
            <button class="btn-whatsapp" onclick="compartirWp('efectivo')">Copiar para WhatsApp</button>
        </div>

        <div id="sec-cop" class="seccion">
            <label>Monto Zelle ($):</label>
            <input type="number" id="montoZelle" value="0.00" step="1" inputmode="decimal">
            <label>Tasa Zelle -> COP:</label>
            <input type="number" id="tasaZelleCop" value="0" step="1" inputmode="decimal">
            <label>Tasa COP -> USDT:</label>
            <input type="number" id="tasaCopUsdt" value="0" step="1" inputmode="decimal">
            <label>Comisión:</label>
            <select id="tipoComisionCop">
                <option value="fija">Fija ($)</option>
                <option value="porcentaje">Porcentaje (%)</option>
            </select>
            <input type="number" id="valorComisionCop" value="0.0" step="0.1" inputmode="decimal">
            <button class="btn-principal" onclick="calcularCop()">Calcular</button>
            <div class="result" id="resCop">Resultado: 0%</div>
            <button class="btn-whatsapp" onclick="compartirWp('zelle_cop')">Copiar para WhatsApp</button>
        </div>

        <div class="footer-tech">desarrollado por ByMO Technology</div>
    </div>

    <script>
        function cambiarMenu() {
            document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
            let sel = document.getElementById('menuTipo').value;
            document.getElementById('sec-' + (sel === 'zelle_cop' ? 'cop' : sel)).classList.add('activa');
        }

        function actualizarLabelMoneda() {
            let mon = document.getElementById('monedaRef').value;
            let sim = mon === 'USD' ? '$' : '€';
            document.getElementById('labelPrecioRef').innerText = sim;
            document.getElementById('labelTasaRef').innerText = 'Bs/' + sim;
        }

        function getColorClass(valor) { return valor >= 0 ? "texto-verde" : "texto-rojo"; }

        function calcularProducto() {
            let pU = parseFloat(document.getElementById('prodUsd').value) || 0;
            let tB = parseFloat(document.getElementById('tasaBcv').value) || 0;
            let tI = parseFloat(document.getElementById('tasaBin').value) || 0;
            let costoBs = pU * tB;
            let usdtNec = tI > 0 ? (costoBs / tI) : 0;
            let ahorro = tI > 0 ? ((tI - tB) / tI) * 100 : 0;
            let resHtml = "Necesitas: <b>" + usdtNec.toFixed(2) + " USDT</b><br><small>Equivale a: " + costoBs.toFixed(2) + " Bs";
            if (ahorro !== 0) resHtml += "<br>Diferencial: <span class='" + getColorClass(ahorro) + "'>" + Math.abs(ahorro).toFixed(2) + "%</span>";
            document.getElementById('resProd').innerHTML = resHtml + "</small>";
        }

        function calcularBanco() {
            let pU = parseFloat(document.getElementById('precioUsdt1').value) || 0;
            let pB = parseFloat(document.getElementById('precioBcv1').value) || 0;
            let cB = parseFloat(document.getElementById('comBanco').value) || 0;
            let cBin = parseFloat(document.getElementById('comBinance').value) || 0;
            let costo = (100 * pB) * (1 + (cB / 100));
            let rec = 100 * (1 - (cBin / 100)) * pU;
            let rent = costo > 0 ? ((rec - costo) / costo) * 100 : 0;
            document.getElementById('resBanco').innerHTML = "Rentabilidad: <span class='" + getColorClass(rent) + "'>" + rent.toFixed(2) + "%</span>";
        }

        function calcularEfectivo() {
            let t = document.getElementById('tipoCambioEf').value;
            let pU = parseFloat(document.getElementById('precioUsdt2').value) || 0;
            let pE = parseFloat(document.getElementById('precioEf').value) || 0;
            let c = parseFloat(document.getElementById('comCambio').value) || 0;
            let costo = (t === "usdt_a_efectivo") ? (100 * pU) : (100 * pE);
            let rec = (t === "usdt_a_efectivo") ? (100 * (1 - (c/100)) * pE) : (100 * (1 - (c/100)) * pU);
            let rent = costo > 0 ? ((rec - costo) / costo) * 100 : 0;
            document.getElementById('resEfectivo').innerHTML = "Rentabilidad: <span class='" + getColorClass(rent) + "'>" + rent.toFixed(2) + "%</span>";
        }

        function calcularCop() {
            let cap = parseFloat(document.getElementById('montoZelle').value) || 0;
            let tZC = parseFloat(document.getElementById('tasaZelleCop').value) || 0;
            let tCU = parseFloat(document.getElementById('tasaCopUsdt').value) || 0;
            let tipo = document.getElementById('tipoComisionCop').value;
            let val = parseFloat(document.getElementById('valorComisionCop').value) || 0;
            let neto = tipo === 'fija' ? (cap - val) : (cap * (1 - (val/100)));
            let usdtF = tCU > 0 ? (neto * tZC / tCU) : 0;
            let rent = cap > 0 ? ((usdtF - cap) / cap) * 100 : 0;
            document.getElementById('resCop').innerHTML = "Rentabilidad: <span class='" + getColorClass(rent) + "'>" + rent.toFixed(2) + "%</span>";
        }

        function compartirWp(modulo) {
            let msg = "*Resumen de Cálculo*\n\n";
            if(modulo === 'producto') {
                let sim = document.getElementById('monedaRef').value === 'USD' ? '$' : '€';
                msg += "Producto: " + document.getElementById('prodUsd').value + " " + sim + " BCV\n";
                msg += "Tasa BCV: " + document.getElementById('tasaBcv').value + " Bs/" + sim + "\n";
                msg += "Tasa USDT: " + document.getElementById('tasaBin').value + " Bs/USDT\n";
                msg += "--------------------------\n";
                msg += "Costo Final: " + document.getElementById('resProd').innerText.split('\n')[0].replace("Necesitas: ", "");
            } else if(modulo === 'banco') {
                msg += "Operación: Banco vs USDT\n";
                msg += "Rentabilidad: " + document.getElementById('resBanco').innerText.replace("Rentabilidad: ", "");
            } else if(modulo === 'efectivo') {
                msg += "Operación: " + (document.getElementById('tipoCambioEf').value === 'usdt_a_efectivo' ? "USDT a Efectivo" : "Efectivo a USDT") + "\n";
                msg += "Rentabilidad: " + document.getElementById('resEfectivo').innerText.replace("Rentabilidad: ", "");
            } else {
                msg += "Operación: Zelle -> COP -> USDT\n";
                msg += "Monto: " + document.getElementById('montoZelle').value + " $\n";
                msg += "Rentabilidad: " + document.getElementById('resCop').innerText.replace("Rentabilidad: ", "");
            }
            msg += "\n\n_Generado por ByMO Technology_";
            navigator.clipboard.writeText(msg).then(() => alert("Resumen copiado. ¡Ya puedes pegarlo en WhatsApp!"));
        }
    </script>
</body>
</html>
